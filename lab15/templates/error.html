<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <div class="page-wrapper center-page">
      <div class="card result-card error-card">
        <p class="student-name">Created by {{ full_name }}</p>
        <h1>Something Went Wrong</h1>
        <p>{{ message or 'An error occurred while processing your request.' }}</p>
        <a href="{{ url_for('home') }}" class="btn secondary-btn link-btn">Return Home</a>
      </div>
    </div>
  </body>
</html>
